[project]
name = "observable-garden"
version = "0.1.0"
description = "Transcript-based overfitting estimator: bootstrapped null-maximum over a search's observed trial correlation structure."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["environments", "searchers", "estimator"]
