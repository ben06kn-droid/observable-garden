name: tests

# The quick target: the tests of quixote/, sancho/ and examples/ (tests/), without the ones marked
# slow. It runs in under two minutes. The research record's tests (research/tests/) are not run
# here: many need machine-local data that is never committed.
on:
  push:
  pull_request:

jobs:
  quick:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,sancho]"
      - name: Quick tests
        run: python -m pytest tests -m "not slow" -q
